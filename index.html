<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI — Merchant Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #F5F5F7; color: #1c1c1e; min-height: 100vh; }

  /* ── Auth ── */
  #auth-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#1B3FA0,#0d2680); }
  .auth-card { background:#fff; border-radius:24px; padding:40px 36px; width:100%; max-width:380px; box-shadow:0 24px 64px rgba(0,0,0,0.18); }
  .auth-logo { font-size:32px; font-weight:800; color:#1B3FA0; margin-bottom:4px; }
  .auth-sub { font-size:13px; color:#888; margin-bottom:28px; }
  .auth-label { font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; display:block; }
  .auth-input { width:100%; padding:12px 14px; border:1.5px solid #e5e5e5; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; outline:none; transition:border-color .2s; margin-bottom:14px; }
  .auth-input:focus { border-color:#1B3FA0; }
  .auth-btn { width:100%; padding:14px; background:linear-gradient(135deg,#1B3FA0,#0d2680); color:#fff; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; cursor:pointer; }
  .auth-err { background:#FEE; border-radius:10px; padding:10px 14px; font-size:12px; color:#E8654A; margin-bottom:14px; display:none; }

  /* ── Layout ── */
  #app { display:none; min-height:100vh; }
  .topbar { background:#fff; border-bottom:1px solid #e5e5e7; padding:0 24px; height:60px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 1px 8px rgba(0,0,0,0.06); }
  .topbar-left { display:flex; align-items:center; gap:12px; }
  .topbar-brand { font-size:18px; font-weight:800; color:#1B3FA0; }
  .merchant-pill { background:#EEF2FF; color:#1B3FA0; font-size:12px; font-weight:700; padding:4px 12px; border-radius:100px; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .logout-btn { background:none; border:1.5px solid #e5e5e7; border-radius:10px; padding:6px 14px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; color:#666; cursor:pointer; }

  /* ── Tabs ── */
  .tabs { display:flex; gap:4px; background:#fff; padding:0 24px; border-bottom:1px solid #e5e5e7; }
  .tab { padding:14px 18px; font-size:13px; font-weight:600; color:#888; cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; white-space:nowrap; }
  .tab.active { color:#1B3FA0; border-bottom-color:#1B3FA0; }

  /* ── Main ── */
  .main { padding:24px; max-width:1200px; margin:0 auto; }

  /* ── Stats ── */
  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
  .stat-card { background:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 1px 6px rgba(0,0,0,0.06); }
  .stat-val { font-size:28px; font-weight:800; color:#1c1c1e; line-height:1; }
  .stat-label { font-size:12px; color:#888; margin-top:4px; font-weight:500; }
  .stat-card.green .stat-val { color:#2e7d32; }
  .stat-card.orange .stat-val { color:#e65100; }
  .stat-card.blue .stat-val { color:#1B3FA0; }

  /* ── Filters ── */
  .filters { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .filter-chip { padding:7px 16px; border-radius:100px; border:1.5px solid #e5e5e7; background:#fff; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; color:#888; cursor:pointer; transition:all .15s; }
  .filter-chip.active { background:#1B3FA0; border-color:#1B3FA0; color:#fff; }
  .search-box { flex:1; min-width:200px; padding:9px 14px; border:1.5px solid #e5e5e7; border-radius:100px; font-family:'DM Sans',sans-serif; font-size:13px; outline:none; }
  .search-box:focus { border-color:#1B3FA0; }

  /* ── Orders grid ── */
  .orders-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
  .order-card { background:#fff; border-radius:20px; box-shadow:0 2px 12px rgba(0,0,0,0.07); overflow:hidden; border:1.5px solid transparent; transition:box-shadow .2s; }
  .order-card:hover { box-shadow:0 4px 20px rgba(0,0,0,0.12); }
  .order-card.new { border-color:#FFA000; }
  .order-card.preparing { border-color:#1B3FA0; }
  .order-card.ready { border-color:#2e7d32; }
  .order-card.delivering { border-color:#7B1FA2; }
  .order-card.done { border-color:#e5e5e7; opacity:.75; }

  .card-header { padding:14px 16px 10px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #f5f5f7; }
  .card-type-icon { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .card-type-icon.pickup { background:#EEF2FF; }
  .card-type-icon.preorder { background:#FFF8E1; }
  .card-type-icon.delivery { background:#F3E5F5; }
  .card-meta { flex:1; }
  .card-code { font-size:14px; font-weight:800; color:#1c1c1e; }
  .card-sub { font-size:11px; color:#888; margin-top:1px; }
  .status-badge { font-size:11px; font-weight:700; padding:4px 10px; border-radius:100px; white-space:nowrap; }
  .badge-new { background:#FFF3E0; color:#E65100; }
  .badge-preparing { background:#E3F2FD; color:#1565C0; }
  .badge-ready { background:#E8F5E9; color:#2E7D32; }
  .badge-delivering { background:#F3E5F5; color:#7B1FA2; }
  .badge-done { background:#F5F5F5; color:#888; }

  .card-body { padding:12px 16px; }
  .customer-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .customer-name { font-size:13px; font-weight:700; color:#1c1c1e; }
  .customer-phone { font-size:12px; color:#888; }
  .items-list { font-size:12px; color:#555; line-height:1.7; margin-bottom:8px; }
  .info-row { display:flex; align-items:center; gap:6px; font-size:12px; color:#666; margin-bottom:4px; }
  .info-row b { color:#1c1c1e; }
  .screenshot-thumb { width:100%; max-height:140px; object-fit:cover; border-radius:10px; cursor:pointer; border:1px solid #e5e5e7; margin-top:6px; display:none; }

  /* ── Actions ── */
  .card-actions { padding:10px 16px 14px; display:flex; gap:8px; flex-wrap:wrap; }
  .action-btn { flex:1; min-width:80px; padding:9px 12px; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700; cursor:pointer; transition:all .15s; }
  .action-btn:active { transform:scale(0.96); }
  .btn-confirm { background:#1B3FA0; color:#fff; }
  .btn-prepare { background:#0288D1; color:#fff; }
  .btn-ready { background:#2E7D32; color:#fff; }
  .btn-assign { background:#7B1FA2; color:#fff; }
  .btn-done { background:#546E7A; color:#fff; }
  .btn-secondary { background:#F5F5F7; color:#555; border:1.5px solid #e5e5e7; }

  /* ── Rider assign modal ── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:999; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal { background:#fff; border-radius:24px; padding:28px; width:100%; max-width:420px; box-shadow:0 24px 64px rgba(0,0,0,0.2); }
  .modal-title { font-size:18px; font-weight:800; margin-bottom:6px; }
  .modal-sub { font-size:13px; color:#888; margin-bottom:20px; }
  .rider-input { width:100%; padding:12px 14px; border:1.5px solid #e5e5e7; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; outline:none; margin-bottom:10px; }
  .rider-input:focus { border-color:#7B1FA2; }
  .rider-presets { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .rider-preset { padding:7px 14px; border-radius:100px; background:#F3E5F5; color:#7B1FA2; font-size:12px; font-weight:700; cursor:pointer; border:none; font-family:'DM Sans',sans-serif; }
  .modal-actions { display:flex; gap:10px; }
  .modal-confirm { flex:1; padding:13px; background:#7B1FA2; color:#fff; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
  .modal-cancel { padding:13px 20px; background:#F5F5F7; color:#555; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; cursor:pointer; }

  /* ── Screenshot modal ── */
  .img-modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; cursor:pointer; }
  .img-modal.open { display:flex; }
  .img-modal img { max-width:100%; max-height:90vh; border-radius:16px; }

  /* ── Empty ── */
  .empty { text-align:center; padding:60px 20px; color:#aaa; }
  .empty-icon { font-size:48px; margin-bottom:12px; }
  .empty-text { font-size:15px; font-weight:600; color:#888; }

  /* ── Toast ── */
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1c1c1e; color:#fff; padding:12px 22px; border-radius:100px; font-size:13px; font-weight:600; z-index:9999; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .3s; }
  .toast.show { opacity:1; }

  @media(max-width:600px) {
    .main { padding:14px; }
    .orders-grid { grid-template-columns:1fr; }
    .stats-row { grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>

<!-- ── Auth ── -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">MIDI</div>
    <div class="auth-sub">Merchant Dashboard</div>
    <div class="auth-err" id="auth-err"></div>
    <label class="auth-label">Email</label>
    <input class="auth-input" type="email" id="auth-email" placeholder="merchant@midi.com">
    <label class="auth-label">Password</label>
    <input class="auth-input" type="password" id="auth-password" placeholder="••••••••">
    <button class="auth-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-brand">MIDI</div>
      <div class="merchant-pill" id="merchant-pill">Merchant</div>
    </div>
    <div class="topbar-right">
      <span style="font-size:13px;color:#888;" id="user-email-display"></span>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('active',this)">🔥 Active Orders</div>
    <div class="tab" onclick="switchTab('done',this)">✅ Completed</div>
  </div>

  <div class="main">
    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card orange"><div class="stat-val" id="stat-new">0</div><div class="stat-label">New Orders</div></div>
      <div class="stat-card blue"><div class="stat-val" id="stat-active">0</div><div class="stat-label">In Progress</div></div>
      <div class="stat-card green"><div class="stat-val" id="stat-done-today">0</div><div class="stat-label">Done Today</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-revenue">RM0</div><div class="stat-label">Today's Revenue</div></div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <input class="search-box" type="text" placeholder="🔍  Search order, name, phone…" oninput="filterOrders(this.value)" id="search-input">
      <div class="filter-chip active" onclick="setFilter('all',this)">All</div>
      <div class="filter-chip" onclick="setFilter('new',this)">New</div>
      <div class="filter-chip" onclick="setFilter('preparing',this)">Preparing</div>
      <div class="filter-chip" onclick="setFilter('ready',this)">Ready</div>
      <div class="filter-chip" onclick="setFilter('delivering',this)">On the Way</div>
    </div>

    <div class="orders-grid" id="orders-grid"></div>
    <div class="empty" id="empty-state" style="display:none;">
      <div class="empty-icon">📭</div>
      <div class="empty-text">No orders here</div>
    </div>
  </div>
</div>

<!-- ── Rider Assign Modal ── -->
<div class="modal-overlay" id="rider-modal">
  <div class="modal">
    <div class="modal-title">🛵 Assign Rider</div>
    <div class="modal-sub" id="rider-modal-sub">Order #—</div>
    <input class="rider-input" id="rider-name-input" placeholder="Rider name…">
    <input class="rider-input" id="rider-phone-input" placeholder="Rider phone (optional)">
    <div class="rider-presets" id="rider-presets">
      <button class="rider-preset" onclick="setRiderPreset('Ali')">Ali</button>
      <button class="rider-preset" onclick="setRiderPreset('Hafiz')">Hafiz</button>
      <button class="rider-preset" onclick="setRiderPreset('Zack')">Zack</button>
      <button class="rider-preset" onclick="setRiderPreset('Amin')">Amin</button>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeRiderModal()">Cancel</button>
      <button class="modal-confirm" onclick="confirmAssignRider()">Assign & Send Out</button>
    </div>
  </div>
</div>

<!-- ── Screenshot Modal ── -->
<div class="img-modal" id="img-modal" onclick="closeImgModal()">
  <img id="img-modal-src" src="">
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, orderBy, updateDoc, doc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkFmMpScduIj1493VWQdDCOAaTUWnWEbk",
  authDomain: "mmu-delivery-a4919.firebaseapp.com",
  projectId: "mmu-delivery-a4919",
  storageBucket: "mmu-delivery-a4919.firebasestorage.app",
  messagingSenderId: "945529333130",
  appId: "1:945529333130:web:915bfd830b44de4e19d473"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ── Merchant config — email → merchantId ──
const MERCHANT_MAP = {
  'oya@midi.com':  { id: 'soy_oden',     name: 'Oya 🥛🍢' },
  'mad@midi.com':  { id: 'mad_drink_lab', name: 'Mad Drink Lab 🧃' },
};

let currentMerchant = null;
let allOrders       = [];
let activeTab       = 'active';
let filterStatus    = 'all';
let searchQ         = '';
let riderTargetId   = null;
let unsub           = null;

// ── Auth ──
window.doLogin = async function() {
  const email = document.getElementById('auth-email').value.trim();
  const pass  = document.getElementById('auth-password').value;
  const err   = document.getElementById('auth-err');
  err.style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    err.textContent = 'Wrong email or password.';
    err.style.display = 'block';
  }
};

window.doLogout = async function() {
  if (unsub) unsub();
  await signOut(auth);
};

onAuthStateChanged(auth, user => {
  if (user) {
    const m = MERCHANT_MAP[user.email];
    if (!m) { signOut(auth); showAuthErr('Not a merchant account.'); return; }
    currentMerchant = m;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('merchant-pill').textContent = m.name;
    document.getElementById('user-email-display').textContent = user.email;
    startListening();
  } else {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    allOrders = [];
  }
});

function showAuthErr(msg) {
  const e = document.getElementById('auth-err');
  e.textContent = msg; e.style.display = 'block';
}

// ── Listen to orders ──
function startListening() {
  if (unsub) unsub();
  const q = query(
    collection(db, 'orders'),
    where('merchantId', '==', currentMerchant.id)
  );
  unsub = onSnapshot(q, snap => {
    allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allOrders.sort((a,b) => {
      const ta = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(0);
      const tb = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(0);
      return tb - ta;
    });
    updateStats();
    renderOrders();
  });
}

// ── Stats ──
function updateStats() {
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todays = allOrders.filter(o => o.timestamp?.toDate && o.timestamp.toDate() >= todayStart);
  document.getElementById('stat-new').textContent    = allOrders.filter(o => o.status === 'new').length;
  document.getElementById('stat-active').textContent = allOrders.filter(o => ['preparing','ready','delivering'].includes(o.status)).length;
  document.getElementById('stat-done-today').textContent = todays.filter(o => o.status === 'done').length;
  const rev = todays.filter(o => o.status === 'done').reduce((s,o) => s + (o.total||0), 0);
  document.getElementById('stat-revenue').textContent = 'RM ' + rev.toFixed(2);
}

// ── Render ──
function renderOrders() {
  let orders = allOrders.filter(o => {
    if (activeTab === 'active') return !['done','cancelled'].includes(o.status);
    return ['done','cancelled'].includes(o.status);
  });
  if (filterStatus !== 'all') orders = orders.filter(o => o.status === filterStatus);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    orders = orders.filter(o =>
      (o.name||'').toLowerCase().includes(q) ||
      (o.phone||'').includes(q) ||
      (o.code||'').toLowerCase().includes(q)
    );
  }

  const grid = document.getElementById('orders-grid');
  const empty = document.getElementById('empty-state');

  if (!orders.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = orders.map(o => buildCard(o)).join('');
}

function typeIcon(type) {
  if (type === 'delivery') return { icon:'🛵', cls:'delivery' };
  if (type === 'preorder') return { icon:'📋', cls:'preorder' };
  return { icon:'🛍', cls:'pickup' };
}

function statusBadge(status) {
  const map = {
    new:        ['New Order 🔔',    'badge-new'],
    preparing:  ['Preparing 👨‍🍳',   'badge-preparing'],
    ready:      ['Ready ✅',         'badge-ready'],
    delivering: ['On the Way 🛵',   'badge-delivering'],
    done:       ['Done ✓',          'badge-done'],
    cancelled:  ['Cancelled',       'badge-done'],
  };
  const [label, cls] = map[status] || [status, 'badge-done'];
  return `<span class="status-badge ${cls}">${label}</span>`;
}

function buildCard(o) {
  const ti = typeIcon(o.type);
  const date = o.timestamp?.toDate ? o.timestamp.toDate().toLocaleString('en-MY', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
  const items = (o.items||[]).map(i => `${i.emoji} ${i.name} ×${i.qty}`).join(' · ');

  let infoRows = '';
  if (o.type === 'preorder' && o.slot)
    infoRows += `<div class="info-row">📅 <b>Slot:</b> ${o.slot}</div>`;
  if (o.type === 'delivery') {
    if (o.address) infoRows += `<div class="info-row">📍 <b>Address:</b> ${o.address}</div>`;
    if (o.deliverySlot || o.slot) infoRows += `<div class="info-row">📅 <b>Slot:</b> ${o.deliverySlot || o.slot}</div>`;
    if (o.rider) infoRows += `<div class="info-row">🛵 <b>Rider:</b> ${o.rider}</div>`;
  }
  if (o.note) infoRows += `<div class="info-row">📝 <b>Note:</b> ${o.note}</div>`;
  infoRows += `<div class="info-row">💳 <b>${o.paymentMethod||'TNG'}</b> · RM ${(o.total||0).toFixed(2)}</div>`;

  const hasScreenshot = !!o.screenshotUrl;

  // Action buttons based on status + type
  let actions = '';
  if (o.status === 'new') {
    actions = `<button class="action-btn btn-confirm" onclick="updateStatus('${o.id}','preparing')">👨‍🍳 Start Preparing</button>`;
  } else if (o.status === 'preparing') {
    actions = `<button class="action-btn btn-ready" onclick="updateStatus('${o.id}','ready')">✅ Mark Ready</button>`;
  } else if (o.status === 'ready') {
    if (o.type === 'delivery') {
      actions = `<button class="action-btn btn-assign" onclick="openRiderModal('${o.id}','${o.code||''}')">🛵 Assign Rider</button>`;
    } else {
      actions = `<button class="action-btn btn-done" onclick="updateStatus('${o.id}','done')">🎉 Mark Done</button>`;
    }
  } else if (o.status === 'delivering') {
    actions = `<button class="action-btn btn-done" onclick="updateStatus('${o.id}','done')">🎉 Delivered</button>`;
  }

  if (hasScreenshot) {
    actions += `<button class="action-btn btn-secondary" onclick="openImgModal('${o.screenshotUrl}')">🧾 Receipt</button>`;
  }

  return `
  <div class="order-card ${o.status}" id="card-${o.id}">
    <div class="card-header">
      <div class="card-type-icon ${ti.cls}">${ti.icon}</div>
      <div class="card-meta">
        <div class="card-code">${o.code || 'Order'} <span style="font-size:10px;font-weight:500;color:#aaa;">${o.type}</span></div>
        <div class="card-sub">${date} · ${o.merchantName||''}</div>
      </div>
      ${statusBadge(o.status)}
    </div>
    <div class="card-body">
      <div class="customer-row">
        <div class="customer-name">${o.name||'—'}</div>
        <div class="customer-phone">${o.phone ? '· '+o.phone : ''}</div>
      </div>
      <div class="items-list">${items}</div>
      ${infoRows}
    </div>
    <div class="card-actions">${actions}</div>
  </div>`;
}

// ── Status update ──
window.updateStatus = async function(id, status) {
  try {
    await updateDoc(doc(db, 'orders', id), { status, updatedAt: serverTimestamp() });
    showToast('✅ Status updated → ' + status);
  } catch(e) {
    showToast('❌ Failed: ' + e.message);
  }
};

// ── Rider modal ──
window.openRiderModal = function(orderId, code) {
  riderTargetId = orderId;
  document.getElementById('rider-modal-sub').textContent = 'Order ' + code;
  document.getElementById('rider-name-input').value = '';
  document.getElementById('rider-phone-input').value = '';
  document.getElementById('rider-modal').classList.add('open');
};
window.closeRiderModal = function() {
  document.getElementById('rider-modal').classList.remove('open');
  riderTargetId = null;
};
window.setRiderPreset = function(name) {
  document.getElementById('rider-name-input').value = name;
};
window.confirmAssignRider = async function() {
  const name  = document.getElementById('rider-name-input').value.trim();
  const phone = document.getElementById('rider-phone-input').value.trim();
  if (!name) { alert('Please enter rider name.'); return; }
  if (!riderTargetId) return;
  try {
    await updateDoc(doc(db, 'orders', riderTargetId), {
      status:      'delivering',
      rider:       name,
      riderPhone:  phone || null,
      updatedAt:   serverTimestamp(),
    });
    showToast('🛵 Rider assigned: ' + name);
    closeRiderModal();
  } catch(e) {
    showToast('❌ Failed: ' + e.message);
  }
};

// ── Screenshot modal ──
window.openImgModal = function(url) {
  document.getElementById('img-modal-src').src = url;
  document.getElementById('img-modal').classList.add('open');
};
window.closeImgModal = function() {
  document.getElementById('img-modal').classList.remove('open');
};

// ── Tab / filter ──
window.switchTab = function(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  filterStatus = 'all';
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  document.querySelector('.filter-chip').classList.add('active');
  renderOrders();
};
window.setFilter = function(status, el) {
  filterStatus = status;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderOrders();
};
window.filterOrders = function(q) {
  searchQ = q;
  renderOrders();
};

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Enter to login
document.getElementById('auth-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.doLogin();
});
</script>
</body>
</html>
